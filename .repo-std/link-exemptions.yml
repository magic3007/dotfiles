# Links that deliberately appear in only one of the two dotbot configs.
# Enforced by .repo-std/checks/link_parity.py — anything not listed here must be
# in both install.conf.yaml and sync.conf.yaml.
#
# Adding an entry is a decision, not a workaround: say which config holds it and
# why the other must not.

- target: ~/.config/fish
  only_in: install.conf.yaml
  reason: >-
    fish is archived and frozen (archive/fish/README.md). A fresh machine still
    gets the link so an existing fish login keeps working, but the 15-minute sync
    must not keep re-creating it on machines that never had fish.

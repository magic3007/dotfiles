# The one dotbot config. ./install runs all of it; sync.sh runs only
# `clean create link` every 15 minutes, then scripts/apply.sh. Delivery rules
# (link, merge, seed): docs/REPO_GUIDE.md §2.

- defaults:
    link:
        create: true
        relink: true

- clean:
    - "~"
    - "~/.config/"
    - "~/.claude/"
    - "~/.codex/"
    - "~/.local/bin/"
    - "~/.cursor/"
    - "~/.pi/"

- create:
    - ~/.vim/undo-history
    - ~/.wastebasket
    - ~/.vim_plugins
    - ~/.minimax

- shell:
    - [
          "for f in .bashrc .zshrc .zshenv; do [ -f ~/$f ] && [ ! -L ~/$f ] && [ ! -e ~/${f}_bk ] && mv ~/$f ~/${f}_bk && echo \"Moved ~/$f to ~/${f}_bk\"; done; true",
          Backing up pre-existing shell rc files,
      ]

- link:
    # ---- Shell ----
    ~/.zshenv: shell/zsh/zshenv
    # An endpoint-security agent rewrites ~/.zshrc as root on some machines,
    # turning the link into a regular file; link only when absent or a link, so
    # dotbot does not abort the whole link section there.
    ~/.zshrc:
        if: '[ ! -e ~/.zshrc ] || [ -L ~/.zshrc ]'
        path: shell/zsh/zshrc
    ~/.zshrc.d: shell/zsh/zshrc.d
    ~/.bashrc: shell/bash/bashrc
    ~/.common_shell_setup.sh: shell/common.sh
    # archive/fish is frozen; it is linked only where fish is installed.
    ~/.config/fish:
        if: 'command -v fish >/dev/null'
        path: archive/fish

    # ---- Git ----
    ~/.gitconfig: git/gitconfig

    # ---- Terminals ----
    ~/.tmux.conf: terminals/tmux.conf
    ~/.config/ghostty/config: terminals/ghostty/config
    ~/.config/cmux/cmux.json: terminals/cmux/cmux.json
    ~/.warp: terminals/warp
    ~/.config/herdr/config.toml: herdr-tui/config.toml
    # herdr-app rewrites settings.json and keys.json via temp file + rename, so
    # those are seeded (scripts/seed-configs.sh); it never writes themes back.
    ~/.config/herdr-app/themes/noir.json: herdr-app/themes/noir.json
    ~/.config/herdr-app/themes/dracula.json: herdr-app/themes/dracula.json

    # ---- Editors ----
    ~/.vimrc: vim/vimrc/vimrc
    ~/.vim_runtime: vim/vimrc
    ~/.ideavimrc: ideavimrc
    ~/.config/nvim: neovim/nvim-basic-ide
    # settings.json of VS Code, Cursor and Antigravity is merged from editors/
    # by scripts/config-merge.py; the rest is linked. chatLanguageModels.json
    # references VS Code Secret Storage and mcp.json holds no credentials.
    ~/Library/Application Support/Code/User/keybindings.json:
        if: 'test "$(uname)" = Darwin'
        path: editors/vscode/keybindings.json
    ~/Library/Application Support/Code/User/chatLanguageModels.json:
        if: 'test "$(uname)" = Darwin'
        path: editors/vscode/chatLanguageModels.json
    ~/Library/Application Support/Code/User/mcp.json:
        if: 'test "$(uname)" = Darwin'
        path: editors/vscode/mcp.json
    ~/Library/Application Support/Code/User/prompts:
        if: 'test "$(uname)" = Darwin'
        path: editors/vscode/prompts
    ~/Library/Application Support/Cursor/User/keybindings.json:
        if: 'test "$(uname)" = Darwin'
        path: editors/cursor/keybindings.json
    ~/Library/Application Support/Antigravity/User/keybindings.json:
        if: 'test "$(uname)" = Darwin'
        path: editors/antigravity/keybindings.json

    # ---- File managers and CLI tools ----
    ~/.config/ranger: ranger
    ~/.config/joshuto: joshuto
    ~/.config/yazi: yazi
    ~/.config/lsd: lsd
    ~/.config/starship.toml: starship/starship.toml
    ~/.config/bat/config: bat/config
    ~/.gdb: gdb
    ~/.gdbinit: gdb/gdbinit
    ~/.Rprofile: Rprofile
    ~/.local/bin/yolo: scripts/tools/yolo-generic.sh
    ~/.chatgpt.sh: chatgpt/chatgpt.sh

    # ---- Package-manager mirrors ----
    ~/.condarc: mirrors/condarc
    ~/.npmrc: mirrors/npmrc
    ~/.config/pip/pip.conf: mirrors/pip.conf
    ~/.cargo/config.toml: mirrors/cargo.toml

    # ---- macOS ----
    ~/.yabairc:
        if: 'test "$(uname)" = Darwin'
        path: macos/yabairc
    ~/.skhdrc:
        if: 'test "$(uname)" = Darwin'
        path: macos/skhdrc
    ~/.skhd:
        if: 'test "$(uname)" = Darwin'
        path: macos/skhd
    ~/.config/karabiner/karabiner.json:
        if: 'test "$(uname)" = Darwin'
        path: macos/karabiner/karabiner.json
    ~/.config/karabiner/assets:
        if: 'test "$(uname)" = Darwin'
        path: macos/karabiner/assets
    ~/.config/iterm2/com.googlecode.iterm2.plist:
        if: 'test "$(uname)" = Darwin'
        path: macos/iterm2/com.googlecode.iterm2.plist

    # ---- AI harnesses ----
    # Codex, mcode, the Antigravity CLI and Pi's settings.json rewrite themselves,
    # so they are merged by scripts/config-merge.py; kimi's config is seeded.
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/config.json: claude/config.json
    ~/.claude/hooks: claude/hooks
    ~/.claude/scripts: claude/scripts
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    ~/.codex/AGENTS.md: codex/AGENTS.md
    ~/.codex/agents: codex/agents
    ~/.pi/agent/AGENTS.md: pi/AGENTS.md
    ~/.pi/agent/models.json: pi/models.json
    ~/.pi/agent/my-pi-plugins: pi/my-pi-plugins
    ~/.pi/agent/extensions: pi/extensions
    ~/.pi/agent/agents: pi/agents
    ~/.config/opencode/opencode.json: opencode/opencode.json
    ~/.config/opencode/package.json: opencode/package.json
    # omp keeps config.yml writable and strips its comments; see omp/README.md.
    # ~/.omp/agent/extensions is a real directory, so its files link one by one.
    ~/.omp/agent/config.yml: omp/config.yml
    ~/.omp/agent/models.yml: omp/models.yml
    ~/.omp/agent/gateways-login.json: omp/gateways-login.json
    ~/.omp/agent/WATCHDOG.yml: omp/WATCHDOG.yml
    ~/.omp/agent/AGENTS.md: omp/AGENTS.md
    ~/.omp/agent/RULES.md: omp/RULES.md
    ~/.omp/agent/extensions/deepen.ts: omp/extensions/deepen.ts
    # The xmatrix daemon finds harnesses only on its unit's fixed PATH, which
    # has ~/.local/bin but not ~/.bun/bin; omp's shim needs bun too. force: the
    # omp installer writes a regular ELF to ~/.local/bin/omp when bun is absent,
    # and force applies only once the `if` holds, so it never removes the only omp.
    ~/.local/bin/bun:
        if: '[ -x ~/.bun/bin/bun ]'
        path: ~/.bun/bin/bun
        force: true
    ~/.local/bin/omp:
        if: '[ -x ~/.bun/bin/omp ]'
        path: ~/.bun/bin/omp
        force: true

    # ---- Desktop and services ----
    # .desktop Exec does not expand ~, so the guard uses the same absolute path
    # as grok-bot/grok-bot.desktop; see grok-bot/README.md.
    ~/.config/autostart/grok-bot.desktop:
        if: '[ -x /home/magic/.local/bin/grok-bot ]'
        path: grok-bot/grok-bot.desktop
    ~/.local/bin/proxy-env: proxy/proxy-env.sh
    ~/.config/systemd/user/proxy-env.service:
        if: 'test "$(uname)" = Linux'
        path: proxy/proxy-env.service

- shell:
    - command: bash scripts/apply.sh
      description: Applying local state (seeds, merges, skill views, vim plugins, xmatrix)
      stdout: true
      stderr: true
    - command: bash scripts/provision.sh
      description: Provisioning tools (network; every step is idempotent and non-fatal)
      stdout: true
      stderr: true

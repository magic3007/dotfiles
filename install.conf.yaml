# =============================================================================
# Dotbot Configuration - Dotfiles Installation
# =============================================================================
# Usage: ./install
# Dotbot docs: https://github.com/anishathalye/dotbot
#
# Structure:
#   Phase 1 — Local operations (no network required, always succeeds)
#   Phase 2 — Network-dependent operations (with timeouts, non-blocking)
# =============================================================================

# ===========================================================================
# Phase 1: Local Operations (no network required)
# ===========================================================================

# ---------------------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------------------
- defaults:
    link:
        create: true
        relink: true

# ---------------------------------------------------------------------------
# Clean broken symlinks
# ---------------------------------------------------------------------------
- clean: ["~"]

# ---------------------------------------------------------------------------
# Create directories
# ---------------------------------------------------------------------------
- create:
    - ~/.vim/undo-history
    - ~/.wastebasket
    - ~/.config/karabiner
    - ~/.codex
    - ~/.gemini
    - ~/.pi/agent

# ---------------------------------------------------------------------------
# Git submodules (local if already initialized)
# ---------------------------------------------------------------------------
- shell:
    - [git submodule update --init --recursive, Installing submodules]

# ---------------------------------------------------------------------------
# Platform-specific directory setup
# ---------------------------------------------------------------------------
- shell:
    - [
          test "$(uname)" = "Darwin" && mkdir -p ~/Library/Application\ Support/Cursor/User || true,
          Creating Cursor config directory on macOS,
      ]
    - [
          test "$(uname)" = "Darwin" && mkdir -p ~/.config/iterm2 || true,
          Creating iTerm2 config directory,
      ]
    - [
          mkdir -p ~/.config/ghostty || true,
          Creating Ghostty config directory,
      ]
    - [
          mkdir -p ~/.config/cmux || true,
          Creating cmux config directory,
      ]

# ---------------------------------------------------------------------------
# Backup existing configs before symlinking
# ---------------------------------------------------------------------------
- shell:
    - [
          "test -f ~/.bashrc && ! test -L ~/.bashrc && ! test -f ~/.bashrc_bk && mv ~/.bashrc ~/.bashrc_bk && echo 'Moved existing ~/.bashrc to ~/.bashrc_bk' || true",
          Backing up existing ~/.bashrc to ~/.bashrc_bk,
      ]
    - [
          "test -f ~/.zshrc && ! test -L ~/.zshrc && ! test -f ~/.zshrc_bk && mv ~/.zshrc ~/.zshrc_bk && echo 'Moved existing ~/.zshrc to ~/.zshrc_bk' || true",
          Backing up existing ~/.zshrc to ~/.zshrc_bk,
      ]
    - [
          "test -f ~/.zshenv && ! test -L ~/.zshenv && ! test -f ~/.zshenv_bk && mv ~/.zshenv ~/.zshenv_bk && echo 'Moved existing ~/.zshenv to ~/.zshenv_bk' || true",
          Backing up existing ~/.zshenv to ~/.zshenv_bk,
      ]

# ---------------------------------------------------------------------------
# Symlinks
# ---------------------------------------------------------------------------
- link:
    # ---- Shell ----
    ~/.zshenv: oh-my-zsh/zshenv
    ~/.zshrc: oh-my-zsh/zshrc
    ~/.zshrc.d: oh-my-zsh/zshrc.d
    ~/.bashrc: bash/bashrc
    ~/.common_shell_setup.sh: common_shell_setup.sh

    # ---- Git ----
    ~/.gitconfig: git/gitconfig

    # ---- Terminal multiplexer ----
    ~/.tmux.conf: tmux.conf

    # ---- Editors ----
    ~/.vimrc: vim/vimrc/vimrc
    ~/.vim_runtime: vim/vimrc
    ~/.ideavimrc: ideavimrc
    ~/.config/nvim: neovim/nvim-basic-ide

    # ---- File manager ----
    ~/.config/ranger: ranger
    ~/.config/joshuto: joshuto
    ~/.config/yazi: yazi

    # ---- CLI tools ----
    ~/.config/lsd: lsd
    ~/.config/starship.toml: starship/starship.toml
    ~/.config/bat/config: bat/config

    # ---- Fish shell ----
    ~/.config/fish: fish

    # ---- Debugger ----
    ~/.gdb: gdb
    ~/.gdbinit: gdb/gdbinit

    # ---- Package managers (with CN mirrors) ----
    ~/.condarc: condarc
    ~/.mambarc: mambarc
    ~/.npmrc: npmrc
    ~/.config/pip/pip.conf: pip.conf
    ~/.cargo/config.toml: cargo/config.toml

    # ---- Language config ----
    ~/.Rprofile: Rprofile

    # ---- macOS window management ----
    ~/.yabairc: yabairc
    ~/.skhdrc: skhdrc
    ~/.skhd: skhd
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json
    ~/.config/karabiner/assets: karabiner/assets

    # ---- IDE / Editor config ----
    ~/.vscoderc: vscode/vscoderc
    ~/Library/Application Support/Cursor/User/keybindings.json: cursor_config/keybindings.json
    ~/Library/Application Support/Cursor/User/settings.json: cursor_config/settings.json
    ~/Library/Application Support/Antigravity/User/keybindings.json: antigravity_config/keybindings.json
    ~/Library/Application Support/Antigravity/User/settings.json: antigravity_config/settings.json

    # ---- AI tools ----
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/config.json: claude/config.json
    ~/.claude/skills: claude/skills
    ~/.claude/commands: claude/commands
    ~/.claude/hooks: claude/hooks
    ~/.claude/scripts: claude/scripts
    ~/.codex/config.json: codex/config.json
    ~/.codex/settings.json: codex/settings.json
    ~/.codex/codex_env.sh: codex/codex_env.sh
    ~/.codex/skills: codex/skills
    ~/.gemini/settings.json: gemini/settings.json
    ~/.gemini/skills: gemini/skills
    ~/.pi/agent/settings.json: pi/settings.json
    ~/.pi/agent/models.json: pi/models.json
    ~/.chatgpt.sh: chatgpt/chatgpt.sh
    ~/.config/opencode/opencode.json: opencode/opencode.json
    ~/.config/opencode/package.json: opencode/package.json
    ~/.kimi-code/config.toml: kimi-code/config.toml
    ~/.local/bin/yolo: scripts/yolo-generic.sh

    # ---- Cursor skills ----
    ~/.cursor/skills: claude/skills

    # ---- iTerm2 ----
    ~/.config/iterm2/com.googlecode.iterm2.plist: iterm2/com.googlecode.iterm2.plist

    # ---- Ghostty ----
    ~/.config/ghostty/config: ghostty/config

    # ---- cmux ----
    ~/.config/cmux/cmux.json: cmux/cmux.json

    # ---- Warp ----
    ~/.warp: warp

# ---------------------------------------------------------------------------
# Sync vim plugins to local disk for faster startup on network filesystems
# ---------------------------------------------------------------------------
- create:
    - ~/.vim_plugins

- shell:
    - [
          "rsync -a --delete vim/vimrc/sources_non_forked/ ~/.vim_plugins/sources_non_forked/ && rsync -a --delete vim/vimrc/sources_forked/ ~/.vim_plugins/sources_forked/",
          Syncing vim plugins to local disk,
      ]

# ---------------------------------------------------------------------------
# Local post-link setup
# ---------------------------------------------------------------------------
- shell:
    - [
          chmod +x ~/.claude/hooks/check-expert-update.sh 2>/dev/null || true,
          Setting execute permission for Claude hooks,
      ]
    - [
          chmod +x ~/.claude/hooks/rtk-rewrite.sh 2>/dev/null || true,
          Setting execute permission for RTK hook,
      ]

# ---------------------------------------------------------------------------
# Enable auto-sync (every 15 minutes)
# ---------------------------------------------------------------------------
- shell:
    - [
          bash sync.sh --install || true,
          Enabling automatic dotfiles sync (every 15 minutes),
      ]

# ===========================================================================
# Phase 2: Network-Dependent Operations
# ===========================================================================
# All commands below use --connect-timeout / || true to avoid blocking
# when network is unavailable.

# ---------------------------------------------------------------------------
# Platform-specific packages
# ---------------------------------------------------------------------------
- shell:
    - [bash install-scripts/linux/install-packages.sh || true, Installing Linux system packages (apt/conda/mamba)]
    - [bash install-scripts/mac/install-brew.sh || true, Installing Homebrew on macOS]
    - [bash install-scripts/mac/install-packages.sh || true, Installing macOS packages with Homebrew]

# ---------------------------------------------------------------------------
# oh-my-zsh
# ---------------------------------------------------------------------------
- shell:
    - [
          "test ! -d ~/.oh-my-zsh && CHSH=no RUNZSH=no KEEP_ZSHRC=yes sh -c \"$(curl --connect-timeout 10 -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)\" || true",
          Installing oh-my-zsh (without changing default shell),
      ]

# ---------------------------------------------------------------------------
# oh-my-zsh plugins
# ---------------------------------------------------------------------------
- git:
    "~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting":
        url: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
        description: "zsh plugin: zsh-syntax-highlighting"
    "~/.oh-my-zsh/custom/plugins/zsh-autosuggestions":
        url: "https://github.com/zsh-users/zsh-autosuggestions"
        description: "zsh plugin: zsh-autosuggestions"
    "~/.oh-my-zsh/custom/plugins/zsh-wakatime":
        url: "https://github.com/wbinglee/zsh-wakatime.git"
        description: "zsh plugin: zsh-wakatime"
    "~/.oh-my-zsh/custom/plugins/autojump":
        url: "https://github.com/wting/autojump.git"
        description: "zsh plugin: autojump"
    "~/.oh-my-zsh/custom/plugins/zsh-vi-mode":
        url: "https://github.com/jeffreytse/zsh-vi-mode.git"
        description: "zsh plugin: zsh-vi-mode"

- shell:
    - [
          "test -d ~/.oh-my-zsh/custom/plugins/autojump && cd ~/.oh-my-zsh/custom/plugins/autojump && ./install.py || true",
          Installing autojump,
      ]

# ---------------------------------------------------------------------------
# fzf
# ---------------------------------------------------------------------------
- git:
    "~/.fzf":
        url: "https://github.com/junegunn/fzf.git"
        description: "fzf - fuzzy finder"

- shell:
    - [test -d ~/.fzf && ~/.fzf/install --all || true, Installing fzf]

# ---------------------------------------------------------------------------
# Fish shell plugins (Fisher)
# ---------------------------------------------------------------------------
- shell:
    - [
          "command -v fish >/dev/null && fish -c 'curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher' || true",
          Installing Fisher plugin manager for fish,
      ]
    - [
          "command -v fish >/dev/null && test -f ~/.config/fish/fish_plugins && fish -c 'fisher update' || true",
          Installing fish plugins via Fisher,
      ]

# ---------------------------------------------------------------------------
# Node.js (prerequisite for AI coding tools)
# ---------------------------------------------------------------------------
- shell:
    - [
          "(export NVM_DIR=\"$HOME/.nvm\" && (test -d \"$NVM_DIR\" || curl --connect-timeout 10 -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash) && . \"$NVM_DIR/nvm.sh\" && nvm install --lts) || true",
          Installing nvm and Node.js LTS,
      ]

# ---------------------------------------------------------------------------
# GitHub CLI
# ---------------------------------------------------------------------------
- shell:
    - [bash install-scripts/linux/install-gh.sh || true, Installing GitHub CLI on Linux]
    - [bash install-scripts/mac/install-gh.sh || true, Installing GitHub CLI on macOS]

# ---------------------------------------------------------------------------
# AI Coding Tools
# ---------------------------------------------------------------------------
# Note: Claude Code now uses npm (was official install script)
# Manual install references:
#   Claude Code:  npm install -g @anthropic-ai/claude-code
#   OpenAI Codex: npm install -g @openai/codex
#   Gemini CLI:   npm install -g @google/gemini-cli
#   Pi:           npm install -g --ignore-scripts @earendil-works/pi-coding-agent
#   Opencode:     curl -fsSL https://opencode.ai/install | bash
- shell:
    - [
          "export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v claude >/dev/null || npm install -g @anthropic-ai/claude-code@latest || true",
          Installing Claude Code CLI via npm,
      ]
    - [
          "export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v codex >/dev/null || npm install -g @openai/codex@latest || true",
          Installing OpenAI Codex CLI,
      ]
    - [
          "export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v gemini >/dev/null || npm install -g @google/gemini-cli@latest || true",
          Installing Google Gemini CLI,
      ]
    - [
          "export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v pi >/dev/null || npm install -g --ignore-scripts @earendil-works/pi-coding-agent@latest || true",
          Installing Pi coding agent,
      ]
    - [
          "command -v opencode >/dev/null || curl --connect-timeout 10 -fsSL https://opencode.ai/install | bash || true",
          Installing Opencode CLI,
      ]
    - [
          "command -v kimi >/dev/null || curl --connect-timeout 10 -fsSL https://code.kimi.com/kimi-code/install.sh | bash || true",
          Installing Kimi Code CLI,
      ]
    - [
          "export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v happy >/dev/null || npm install -g happy@latest || true",
          Installing happy git workflow helper,
      ]
    - [
          "export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v codexapp >/dev/null || npm install -g codexapp@latest firebase@latest || true",
          Installing CodexApp UI,
      ]

# ---------------------------------------------------------------------------
# Lark/Feishu CLI (official CLI for Lark/Feishu platform)
# ---------------------------------------------------------------------------
- shell:
    - [
        "export NVM_DIR=\"$HOME/.nvm\" && [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v lark-cli >/dev/null || npx @larksuite/cli@latest install || true",
        Installing Lark/Feishu CLI (lark-cli),
      ]

# ---------------------------------------------------------------------------
# WeChat Reminder (inlined, no longer fetched from gitee)
# ---------------------------------------------------------------------------
- shell:
    - [
          "mkdir -p $HOME/.wechat-reminder && cp wechat-reminder/wechat-reminder wechat-reminder/wechat-reminder_main.py wechat-reminder/requirements.txt wechat-reminder/LICENSE $HOME/.wechat-reminder/ && chmod +x $HOME/.wechat-reminder/wechat-reminder $HOME/.wechat-reminder/wechat-reminder_main.py",
          Installing wechat-reminder,
      ]
    - [
          "test -f $HOME/.wechat-reminder/requirements.txt && python3 -m venv $HOME/.wechat-reminder/.venv && $HOME/.wechat-reminder/.venv/bin/pip install -q -r $HOME/.wechat-reminder/requirements.txt || true",
          Setting up wechat-reminder venv,
      ]

# ---------------------------------------------------------------------------
# uv - Python package manager
# ---------------------------------------------------------------------------
- shell:
    - [
          "command -v uv >/dev/null || curl --connect-timeout 30 -LsSf https://astral.sh/uv/install.sh | sh || true",
          Installing uv Python package manager,
      ]
    - [
          "command -v uv >/dev/null && uv python install 3.12 3.11 3.10 || true",
          Installing Python versions via uv,
      ]
    - [
          "command -v uv >/dev/null && uv venv --python 3.12 --prompt base --seed ~/.venv || true",
          Creating global Python venv at ~/.venv with pip,
      ]

# ---------------------------------------------------------------------------
# iTerm2 configuration
# ---------------------------------------------------------------------------
- shell:
    - [
          test "$(uname)" = "Darwin" && defaults write com.googlecode.iterm2.plist PrefsCustomFolder -string "~/.config/iterm2" && defaults write com.googlecode.iterm2.plist LoadPrefsFromCustomFolder -bool true || true,
          Configuring iTerm2 to load preferences from ~/.config/iterm2,
      ]

# ---------------------------------------------------------------------------
# CC Gateway - Claude Code reverse proxy
# ---------------------------------------------------------------------------
- shell:
    - [
          bash ~/.claude/cc-gateway/install.sh || true,
          Installing CC Gateway for Claude Code,
      ]

# =============================================================================
# sync.conf.yaml — Cross-platform dotfiles sync (no network required)
# Used by sync.sh for automatic 15-min sync across all machines
# =============================================================================

- defaults:
    link:
        create: true
        relink: true

- clean:
    - "~/.config/"
    - "~/.claude/"
    - "~/.codex/"
    - "~/.gemini/"
    - "~/.local/bin/"
    - "~/.cursor/"
    - "~/.pi/"

- create:
    - ~/.vim/undo-history
    - ~/.wastebasket
    - ~/.config/ghostty
    - ~/.config/cmux
    - ~/.config/bat

- link:
    # ---- Shell ----
    ~/.zshenv: oh-my-zsh/zshenv
    # Same guard as install.conf.yaml: the endpoint-security agent rewrites
    # ~/.zshrc as root, which would otherwise fail this sync on every 15-minute
    # tick. Link only when the target is absent or already a symlink.
    ~/.zshrc:
        if: '[ ! -e ~/.zshrc ] || [ -L ~/.zshrc ]'
        path: oh-my-zsh/zshrc
    ~/.zshrc.d: oh-my-zsh/zshrc.d
    ~/.bashrc: bash/bashrc
    ~/.common_shell_setup.sh: common_shell_setup.sh

    # ---- Git ----
    ~/.gitconfig: git/gitconfig

    # ---- Terminal multiplexer ----
    ~/.tmux.conf: tmux.conf

    # ---- Editors ----
    ~/.vimrc: vim/vimrc/vimrc
    ~/.vim_runtime: vim/vimrc
    ~/.ideavimrc: ideavimrc
    ~/.config/nvim: neovim/nvim-basic-ide
    # VS Code user config (macOS). Same files as install.conf.yaml; the 15-minute
    # tick restores them if VS Code or a sync drops a link.
    ~/Library/Application Support/Code/User/keybindings.json:
        if: 'test "$(uname)" = Darwin'
        path: vscode_config/keybindings.json
    ~/Library/Application Support/Code/User/settings.json:
        if: 'test "$(uname)" = Darwin'
        path: vscode_config/settings.json
    ~/Library/Application Support/Code/User/chatLanguageModels.json:
        if: 'test "$(uname)" = Darwin'
        path: vscode_config/chatLanguageModels.json
    ~/Library/Application Support/Code/User/mcp.json:
        if: 'test "$(uname)" = Darwin'
        path: vscode_config/mcp.json
    ~/Library/Application Support/Code/User/prompts:
        if: 'test "$(uname)" = Darwin'
        path: vscode_config/prompts

    # ---- File managers ----
    ~/.config/ranger: ranger
    ~/.config/joshuto: joshuto
    ~/.config/yazi: yazi

    # ---- CLI tools ----
    ~/.config/lsd: lsd
    ~/.config/starship.toml: starship/starship.toml
    ~/.config/bat/config: bat/config

    # ---- Debugger ----
    ~/.gdb: gdb
    ~/.gdbinit: gdb/gdbinit

    # ---- Package managers (CN mirrors) ----
    ~/.condarc: condarc
    ~/.mambarc: mambarc
    ~/.npmrc: npmrc
    ~/.config/pip/pip.conf: pip.conf
    ~/.cargo/config.toml: cargo/config.toml

    # ---- Language config ----
    ~/.Rprofile: Rprofile

    # ---- AI tools ----
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/config.json: claude/config.json
    # ~/.claude/commands: claude/commands  # deprecated, converted to skills
    ~/.claude/hooks: claude/hooks
    ~/.claude/scripts: claude/scripts
    ~/.claude/statusline-command.sh: claude/statusline-command.sh
    # ~/.codex/config.toml is NOT linked: Codex edits it in place and writes
    # machine state into it, which a symlink would push into this repo.
    # scripts/codex-config-sync.py merges the tracked codex/config.toml into it.
    ~/.gemini/settings.json: gemini/settings.json
    ~/.gemini/skills: gemini/skills
    ~/.pi/agent/settings.json: pi/settings.json
    ~/.pi/agent/models.json: pi/models.json
    ~/.pi/agent/my-pi-plugins: pi/my-pi-plugins
    ~/.omp/agent/extensions/deepen.ts: omp/extensions/deepen.ts
    ~/.chatgpt.sh: chatgpt/chatgpt.sh
    ~/.config/opencode/opencode.json: opencode/opencode.json
    ~/.config/opencode/package.json: opencode/package.json
    # ~/.kimi-code/config.toml is NOT linked: the kimi CLI rewrites it with an
    # atomic write+rename, which turns a symlink into a regular file and makes
    # dotbot fail ("already exists but is a regular file or directory").
    # scripts/post-install.d/10-seed-configs.sh seeds it when it is missing.
    ~/.local/bin/yolo: scripts/yolo-generic.sh
    # The xmatrix daemon probes harnesses with the PATH of its systemd unit
    # (~/.config/systemd/user/xmatrix-daemon.service), which omits ~/.bun/bin;
    # without these links the Hub reports omp as "not installed". bun is needed
    # too because omp's shim is `#!/usr/bin/env bun`. Editing the unit's PATH is
    # not durable: `xmatrix setup daemon` regenerates it from a fixed list.
    ~/.local/bin/bun:
        if: '[ -x ~/.bun/bin/bun ]'
        path: ~/.bun/bin/bun
    ~/.local/bin/omp:
        if: '[ -x ~/.bun/bin/omp ]'
        path: ~/.bun/bin/omp
    # Agent-run credentials come from a systemd drop-in generated by
    # scripts/xmatrix-daemon-secrets.sh (see the `shell:` section below), not
    # from a runtime wrapper: `xmatrix agent add --runtime` is ignored.

    # ---- Ghostty (cross-platform) ----
    ~/.config/ghostty/config: ghostty/config

    # ---- cmux ----
    ~/.config/cmux/cmux.json: cmux/cmux.json

# Skill views are generated (per-skill links), not whole-dir links: see
# scripts/sync-skills.py. Never exits non-zero on conflicts (prints warnings).
- shell:
    - command: "bash scripts/post-install.d/10-seed-configs.sh || true"
      description: "Seeding configs that their owning tool rewrites in place"
      stdout: true
      stderr: true
    - [python3 scripts/sync-skills.py, Building skill views from skills/ and <tool>/skills/]
    - [python3 scripts/codex-config-sync.py, Merging shared codex/config.toml into ~/.codex/config.toml]
    - [bash scripts/xmatrix-daemon-secrets.sh, Refreshing the xmatrix daemon secrets drop-in]

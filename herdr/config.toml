onboarding = false
# Herdr configuration
# Place this file at ~/.config/herdr/config.toml
# Full reference: https://herdr.dev/docs/configuration/
#
# This is a minimal default config. Everything commented below is the
# built-in default; uncomment keys only when you explicitly want to
# override a default.

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine, vesper
name = "tokyo-night-day"

# Follow host terminal light/dark appearance and switch Herdr UI themes.
# auto_switch = false
# dark_name = "catppuccin"
# light_name = "catppuccin-latte"

auto_switch = false
[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL, then /bin/sh.
# default_shell = ""

# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
# shell_mode = "auto"

# CWD policy for new panes/tabs/workspaces when no explicit --cwd is given:
# "follow" inherits source pane/workspace, "home" for $HOME,
# "current" for Herdr's process directory, or a fixed path.
new_cwd = "follow"

[update]
# Defaults to "stable" on Linux/macOS and "preview" on Windows.
channel = "stable"
# version_check = true
# manifest_check = true

# ------ Keybindings (prefix is ctrl+b by default) ------
# [keys]
# prefix = "ctrl+b"
# detach = "prefix+q"
# new_tab = "prefix+c"
# new_workspace = "prefix+shift+n"
# toggle_sidebar = "prefix+b"
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# See `herdr --default-config` for the complete live list.

# ------ UI ------
# [ui]
# sidebar_width = 26
# mouse_capture = true
# copy_on_select = true
# pane_borders = true

# Uncomment keys above only when overriding a default.
# Apply changes to a running server with: herdr server reload-config

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"

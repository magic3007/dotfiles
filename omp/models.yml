providers:
  minimax-test:
    baseUrl: https://openplatform-sh-pre.xaminim.com/anthropic/v1
    api: anthropic-messages
    # key 不写环境变量名，写 `!命令`：真值只在未跟踪的 ~/.common_shell_setup_local.sh
    # 里 export，命令直接去那个唯一来源取，跟 gateways-login.json 里 kafara/mafia
    # 的写法一致。为什么不能退回环境变量名（2026-11-02 实测的故障）：
    #   1. herdr 起的 pane 拿不到这些 export。herdr-core 是 systemd --user 的
    #      transient unit（hc-serve-<hash>.service），它的环境来自 systemd --user
    #      manager，不 source ~/.common_shell_setup.sh，manager 自己也没有这些 key。
    #   2. 环境变量缺失时 omp 的 resolveConfigValue() 走第 3 条分支，把整串
    #      "MINIMAX_MY_API_KEY" 当字面量发出去，网关回 401
    #      "login fail: Please carry the API secret key in the 'X-Api-Key' field"。
    #   3. session 01a19bfc（herdr worktree frontcs2-wt/review）就是这么死的：主模型
    #      kafara 撞 429 usage_limit_reached，降级到 minimax-test 后 M78 与
    #      MiniMax-M3.1-Flash 连撞两次 401，整条 fallback 链断掉。
    # `!命令` 由 omp 用 /bin/sh -c 跑（10s 超时，成功缓存，失败 30s 退避），所以
    # 任何启动路径（herdr pane、systemd unit、xmatrix daemon）都取得到 key。
    # 改这行当心 YAML 引号：双引号标量里的 `tr -d '"'` 必须写成 `tr -d '\""'"`；少末尾
    # 那个 `'` 时 YAML 照样解析，但 shell 串引号不闭合，omp 只报 No API key found。
    # 上游 xaminim openplatform 两种头都收（2026-11-02 实测：只发
    # Authorization: Bearer 回 200，只发 X-Api-Key 也回 200），不必再手写 headers。
    auth: apiKey
    apiKey: "!grep -m1 '^export MINIMAX_MY_API_KEY=' $HOME/.common_shell_setup_local.sh | cut -d= -f2- | tr -d '\"'"
    disableStrictTools: true
    models:
    # 窗口 1M 是实测的，不是抄目录：2026-11-02 直连本网关发 prompt，
    # 950,205 与 1,010,205 token 都回 200，1,040,000 token 被上游回
    # 529 (overloaded_error)，边界与 1048576 一致。网关 /v1/models 不带
    # token_limits，contextWindow 只能手写。
    # maxTokens 取 65536：上游的参数校验上限是 524288
    # （"does not support max tokens > 524288"），但那是请求参数上限，
    # 不等于模型单次生成的真实上限，别当生成上限用。
    - id: MiniMax-M78
      name: MiniMax-M78
      reasoning: true
      supportsTools: true
      input:
      - text
      - image
      contextWindow: 1048576
      maxTokens: 65536
      thinking:
        mode: anthropic-adaptive
        efforts:
        - low
        - medium
        - high
        - xhigh
        - max
        defaultLevel: max
        requiresEffort: true
    # flash 模型的真 id 是点号写法。横杠写法 MiniMax-3.1-Flash 不是上游 id：
    # 网关把它模糊匹配到 MiniMax-M3，响应里的 model 字段回显 MiniMax-M3，
    # 跑的根本不是 flash 模型，所以这里不声明；MiniMax-M3 与
    # MiniMax-M3.1-Flash-Preview 同样不声明。minimax-test 只留 M78 与
    # MiniMax-M3.1-Flash 两个 id。
    - id: MiniMax-M3.1-Flash
      name: MiniMax-M3.1-Flash
      reasoning: true
      supportsTools: true
      input:
      - text
      - image
      contextWindow: 1048576
      maxTokens: 65536
      thinking:
        mode: anthropic-adaptive
        efforts:
        - low
        - medium
        - high
        - xhigh
        - max
        defaultLevel: max
        requiresEffort: true
  mafia:
    baseUrl: https://api.appintheloop.com/v1
    api: anthropic-messages
    auth: apiKey
    # 不写真实 key。值先走 omp 的 resolveConfigValue()：
    #   1. `!cmd` 前缀 -> 跑 shell 命令取 stdout
    #   2. 整串是合法环境变量名（$envExact）-> 读该环境变量
    #   3. 都不是 -> 当字面量用
    # 这里走第 1 条而不是第 2 条：herdr pane 的环境里没有 MAFIA_API_KEY（herdr-core
    # 是 systemd --user 的 transient unit，不 source ~/.common_shell_setup_local.sh），
    # 缺失时第 2 条落空、第 3 条会把 "MAFIA_API_KEY" 当 key 发出去。写法与
    # gateways-login.json 里同名 provider 保持一致，值仍只在那个未入库文件里。
    apiKey: "!grep -m1 '^export MAFIA_API_KEY=' $HOME/.common_shell_setup_local.sh | cut -d= -f2- | tr -d '\"'"
    # 该网关 /v1/models 不返回 token_limits（只有 id/owned_by/supported_endpoint_types），
    # 发现值一律落到插件兜底 200000/64000；1M 取自内置目录 anthropic 同名模型。
    models:
    - id: claude-fable-5-1
      name: claude-fable-5-1
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    # claude-opus-5 与 claude-opus-5-5 是上游两个不同的 id，但同属 1M 窗口的
    # Claude 家族。不在这里声明时它只是「发现结果」，窗口/输出上限会落到插件兜底
    # 200000/64000，thinking 档位也只有发现到的 minimal…xhigh。声明体照抄
    # claude-opus-5-5（值取自内置目录 anthropic 的同名/同族模型），只换 id。
    - id: claude-opus-5
      name: claude-opus-5
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5
      name: claude-opus-5-5
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    # -agy 变体（同上游 id 带 -agy 后缀，义指网关侧固定某种代理/agency 形态）
    # 同属 Claude 家族 1M 窗口；不声明就落 200000/64000。条目体照 claude-opus-5-5，
    # 只换 id：-high/-low 的档位由 id 自身决定，与 kafara 的 -high 处理一致，
    # 所以 thinking 仍声明完整 low…max，不按后缀裁剪。
    - id: claude-opus-5-5-high-agy
      name: claude-opus-5-5-high-agy
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5-low-agy
      name: claude-opus-5-5-low-agy
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: MiniMax-M3.1-Flash
      name: MiniMax-M3.1-Flash
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    # gemini-4-carbon 是 Gemini 家族的发现模型。mafia 网关 /v1/models 不返回
    # token_limits，不声明就只能落插件兜底 200000/64000。窗口与输出上限取自
    # openrouter 同 id 的真实元数据（2026-11-13 查 /api/v1/models：
    # context_length 1048576、max_completion_tokens 943718，即 1M / 944K）。
    # 只写这两项：thinking 档位与 headers 沿用发现结果，别覆盖掉。
    # 为什么 maxTokens 要显式写：它只是「请求参数上限」这一侧的值，不写时 omp
    # 按 64000 截断，长输出会被提前掐掉（类比 C++ 里给 vector::reserve 传了错的
    # 容量，容量不等于实际需求但会限制上面的分配）。
    - id: gemini-4-carbon
      name: gemini-4-carbon
      contextWindow: 1048576
      maxTokens: 943718
  # kafara（ai.kafara.men）：/v1/models 只回 id/object/created/owned_by，不声明 token_limits，
  # 发现值一律落到插件兜底 200000/64000。窗口照 mafia 块同款模型补成 1M（内置目录 anthropic
  # 的 claude-opus-5-5 / claude-fable-5-1）；kafara 侧 id 是 devin/ 前缀或 -high 后缀，按原样写。
  # 不需要 mafia 的 X-Sub-Module 头：默认编码系统提示 + 无头直连实测 200（stopReason=stop）。
  kafara:
    baseUrl: https://ai.kafara.men/v1
    api: anthropic-messages
    auth: apiKey
    # apiKey 同 mafia 块：用 `!命令` 从 ~/.common_shell_setup_local.sh 取，不靠环境
    # 变量名，否则 herdr pane（环境里没有 shell secrets）里会退化成把变量名当 key 发出去。
    apiKey: "!grep -m1 '^export KAFARA_API_KEY=' $HOME/.common_shell_setup_local.sh | cut -d= -f2- | tr -d '\"'"
    models:
    # 同理补 devin/claude-opus-5（kafara 发现结果里真实存在的 id，窗口靠兜底
    # 只有 200000）。条目体与 devin/claude-opus-5-5 完全一致，只换 id。
    - id: devin/claude-opus-5
      name: devin/claude-opus-5
      reasoning: true
      contextWindow: 1000000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-opus-5-5
      name: devin/claude-opus-5-5
      reasoning: true
      contextWindow: 1000000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5-high
      name: claude-opus-5-5-high
      reasoning: true
      contextWindow: 1000000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-fable-5-1
      name: devin/claude-fable-5-1
      reasoning: true
      contextWindow: 1000000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    # gpt-6.1-sol 是 OpenAI 家族，不是 Claude：窗口/输出上限照 openrouter 目录里
    # 同一个底层模型 openai/gpt-6.1-sol 的 1,050,000 / 128,000，不照 anthropic 的 1M/64K。
    # 两个数字的来源分强弱：128,000 有网关实测（2026-11-12 直连 /v1/messages，
    # max_tokens=128000 与 200000 都回 200，说明中继不设上限、也不报错，128000 只是
    # 上游真实生成上限）；1,050,000 只是目录值，没做百万 token 实测（一次探针就是
    # 几十万输入 token 的真金白银），当成声明值而不当已验证事实。
    # thinking 不写：发现值已是 low…max（OpenAI 家族不认 anthropic-adaptive 的
    # budget 语义），写了反而要用错的 mode 覆盖对的档位。
    - id: gpt-6.1-sol
      name: gpt-6.1-sol
      reasoning: true
      contextWindow: 1050000
      maxTokens: 128000
  # 火山引擎方舟 Coding Plan（Pro 订阅）。本机只用 Kimi-K3.1-Pro，所以这里写成
  # 静态 provider（不经 gateways-login.json 发现）：发现结果会把账号下 38 个模型
  # 全拉进来，deepseek/doubao/glm 就仍可被选中。apiKey 用 `!命令` 引用，理由同
  # gateways-login.json：xmatrix daemon 拉起的 omp 没有 VE_CODE_API_KEY。
  volcengine:
    baseUrl: https://ark.cn-beijing.volces.com/api/coding/v1
    api: anthropic-messages
    auth: apiKey
    apiKey: "!grep -m1 '^export VE_CODE_API_KEY=' $HOME/.common_shell_setup_local.sh | cut -d= -f2- | tr -d '\"'"
    models:
    - id: kimi-k3.1-pro
      name: kimi-k3.1-pro
      reasoning: true
      input: [text, image]
      contextWindow: 1048576
      maxTokens: 131072

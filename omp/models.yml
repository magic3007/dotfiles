providers:
  mafia:
    baseUrl: https://api.appintheloop.com/v1
    api: anthropic-messages
    auth: apiKey
    # 不写真实 key。值先走 omp 的 resolveConfigValue()：
    #   1. `!cmd` 前缀 -> 跑 shell 命令取 stdout
    #   2. 整串是合法环境变量名（$envExact）-> 读该环境变量
    #   3. 都不是 -> 当字面量用
    # MAFIA_API_KEY 在 ~/.common_shell_setup_local.sh（不入库）里 export。
    apiKey: MAFIA_API_KEY
    models:
    - id: claude-fable-5-1
      name: claude-fable-5-1
      reasoning: true
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5
      name: claude-opus-5-5
      reasoning: true
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: MiniMax-M3.1-Flash-Preview
      name: MiniMax-M3.1-Flash-Preview
      reasoning: true
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
  # 本机 CLIProxyAPI（Devin 账号）。端点与 key 见 ~/cliproxy-yanzhou/config.yaml。
  devin-cliproxy:
    baseUrl: http://127.0.0.1:30288/v1
    api: anthropic-messages
    auth: apiKey
    # 与 MAFIA_API_KEY 同样处理：这里只写环境变量名，真值在
    # ~/.common_shell_setup_local.sh（不入库）里 export。
    apiKey: DEVIN_CLIPROXY_API_KEY
    models:
    - id: devin/claude-opus-5-5
      name: devin/claude-opus-5-5 (CLIProxy)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-fable-5-1
      name: devin/claude-fable-5-1 (CLIProxy)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/gpt-6-astra
      name: devin/gpt-6-astra (CLIProxy)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]

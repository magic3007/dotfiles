providers:
  mafia:
    baseUrl: https://api.appintheloop.com/v1
    api: anthropic-messages
    auth: apiKey
    # 不写真实 key。值先走 omp 的 resolveConfigValue()：
    #   1. `!cmd` 前缀 -> 跑 shell 命令取 stdout
    #   2. 整串是合法环境变量名（$envExact）-> 读该环境变量
    #   3. 都不是 -> 当字面量用
    # MAFIA_API_KEY 在 ~/.common_shell_setup_local.sh（不入库）里 export。
    apiKey: MAFIA_API_KEY
    models:
    - id: claude-fable-5-1
      name: claude-fable-5-1
      reasoning: true
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5
      name: claude-opus-5-5
      reasoning: true
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: MiniMax-M3.1-Flash-Preview
      name: MiniMax-M3.1-Flash-Preview
      reasoning: true
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
  # 本机 CLIProxyAPI（Devin 账号）。端点与 key 见 ~/cliproxy-yanzhou/config.yaml。
  devin-cliproxy:
    baseUrl: http://127.0.0.1:30288/v1
    api: anthropic-messages
    auth: apiKey
    # 与 MAFIA_API_KEY 同样处理：这里只写环境变量名，真值在
    # ~/.common_shell_setup_local.sh（不入库）里 export。
    apiKey: DEVIN_CLIPROXY_API_KEY
    models:
    - id: devin/claude-opus-5-5
      name: devin/claude-opus-5-5 (CLIProxy)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-fable-5-1
      name: devin/claude-fable-5-1 (CLIProxy)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/gpt-6-astra
      name: devin/gpt-6-astra (CLIProxy)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
  # 与 MAFIA_API_KEY 同样处理：这里只写环境变量名，真值在
  # ~/.common_shell_setup_local.sh（不入库）里 export。
  # 选模型用 provider 前缀引用，例如：
  #   omp --model kafara-ai/devin/claude-opus-4-7
  #   omp --model kai-opus        （见 config.yml 的 modelRoles）
  kafara-ai:
    baseUrl: https://ai.kafara.men/v1
    api: anthropic-messages
    auth: apiKey
    apiKey: KAFARA_API_KEY
    models:
    - id: devin/claude-opus-4-7
      name: Opus 4.7 (Kafara AI)
      reasoning: true
      input: [text, image]
      # 网关的 /v1/models 不返回 context 上限，以下取保守值。
      contextWindow: 200000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-opus-5-5
      name: Opus 5.5 (Kafara AI)
      reasoning: true
      input: [text, image]
      contextWindow: 200000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-sonnet-4-6
      name: Sonnet 4.6 (Kafara AI)
      reasoning: true
      input: [text, image]
      contextWindow: 200000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-fable-5-1
      name: Fable 5.1 (Kafara AI)
      reasoning: true
      input: [text, image]
      contextWindow: 200000
      maxTokens: 64000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-haiku-5-5
      name: Haiku 5.5 (Kafara AI)
      reasoning: true
      input: [text, image]
      contextWindow: 200000
      maxTokens: 32000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high"]
    - id: grok-4.7
      name: Grok 4.7 (Kafara AI)
      reasoning: true
      input: [text, image]
      contextWindow: 200000
      maxTokens: 32000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high"]
    # Antigravity 系（Google AI Pro，走 API_PROVIDER_ANTHROPIC_VERTEX）。
    # 上限取自上游 fetchAvailableModels 的实测值：maxTokens 1000000 / maxOutputTokens 128000。
    # 这 6 个模型共用一个额度池（按 token 扣减，窗口约 65 万 input token）。
    - id: claude-opus-5-5-high
      name: Opus 5.5 High (Antigravity)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 128000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high"]
    - id: claude-opus-5-5-medium
      name: Opus 5.5 Medium (Antigravity)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 128000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high"]
    - id: claude-opus-5-5-low
      name: Opus 5.5 Low (Antigravity)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 128000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high"]
    - id: claude-sonnet-5-5-high
      name: Sonnet 5.5 High (Antigravity)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 128000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high"]
    - id: claude-sonnet-5-5-medium
      name: Sonnet 5.5 Medium (Antigravity)
      reasoning: true
      input: [text, image]
      contextWindow: 1000000
      maxTokens: 128000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high"]
    - id: claude-sonnet-5-5-low

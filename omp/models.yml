providers:
  mafia:
    baseUrl: https://api.appintheloop.com/v1
    api: anthropic-messages
    auth: apiKey
    # 不写真实 key。值先走 omp 的 resolveConfigValue()：
    #   1. `!cmd` 前缀 -> 跑 shell 命令取 stdout
    #   2. 整串是合法环境变量名（$envExact）-> 读该环境变量
    #   3. 都不是 -> 当字面量用
    # MAFIA_API_KEY 在 ~/.common_shell_setup_local.sh（不入库）里 export。
    apiKey: MAFIA_API_KEY
    # 该网关 /v1/models 不返回 token_limits（只有 id/owned_by/supported_endpoint_types），
    # 发现值一律落到插件兜底 200000/64000；1M 取自内置目录 anthropic 同名模型。
    models:
    - id: claude-fable-5-1
      name: claude-fable-5-1
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5
      name: claude-opus-5-5
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: MiniMax-M3.1-Flash-Preview
      name: MiniMax-M3.1-Flash-Preview
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
  # 火山引擎方舟 Coding Plan（Pro 订阅），与 gateways-login.json 的 volcengine 网关
  # 是同一个 provider：这里只为 kimi-k3 补真实窗口。/api/coding 不返回 token_limits，
  # 发现结果会落到插件兜底 200000/64000；1M/131072 取自内置目录同名模型的两处一致值
  # （moonshot kimi-k3 与 devin kimi-k3）。
  volcengine:
    baseUrl: https://ark.cn-beijing.volces.com/api/coding/v1
    api: anthropic-messages
    auth: apiKey
    apiKey: VE_CODE_API_KEY
    models:
    - id: kimi-k3
      name: kimi-k3
      reasoning: true
      input: [text, image]
      contextWindow: 1048576
      maxTokens: 131072

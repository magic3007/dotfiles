providers:
  minimax-test:
    baseUrl: https://openplatform-sh-pre.xaminim.com/anthropic/v1
    api: anthropic-messages
    # key 写环境变量名：MINIMAX_MY_API_KEY 在未跟踪的 ~/.common_shell_setup_local.sh
    # 里 export；xmatrix daemon 由 scripts/xmatrix-daemon-secrets.sh 的 systemd
    # drop-in 注入同一份环境，所以 daemon 拉起的 omp 也拿得到 key。
    # 上游 xaminim openplatform 现在两种头都收（2026-11-02 实测：只发
    # Authorization: Bearer 回 200，只发 X-Api-Key 也回 200），不必再手写 headers。
    apiKey: MINIMAX_MY_API_KEY
    disableStrictTools: true
    models:
    # 窗口 1M 是实测的，不是抄目录：2026-11-02 直连本网关发 prompt，
    # 950,205 与 1,010,205 token 都回 200，1,040,000 token 被上游回
    # 529 (overloaded_error)，边界与 1048576 一致。网关 /v1/models 不带
    # token_limits，contextWindow 只能手写。
    # maxTokens 取 65536：上游的参数校验上限是 524288
    # （"does not support max tokens > 524288"），但那是请求参数上限，
    # 不等于模型单次生成的真实上限，别当生成上限用。
    - id: MiniMax-M78
      name: MiniMax-M78
      reasoning: true
      supportsTools: true
      input:
      - text
      - image
      contextWindow: 1048576
      maxTokens: 65536
      thinking:
        mode: anthropic-adaptive
        efforts:
        - low
        - medium
        - high
        - xhigh
        - max
        defaultLevel: max
        requiresEffort: true
    # flash 模型的真 id 是点号写法。横杠写法 MiniMax-3.1-Flash 不是上游 id：
    # 网关把它模糊匹配到 MiniMax-M3，响应里的 model 字段回显 MiniMax-M3，
    # 跑的根本不是 flash 模型，所以这里不声明；MiniMax-M3 与
    # MiniMax-M3.1-Flash-Preview 同样不声明。minimax-test 只留 M78 与
    # MiniMax-M3.1-Flash 两个 id。
    - id: MiniMax-M3.1-Flash
      name: MiniMax-M3.1-Flash
      reasoning: true
      supportsTools: true
      input:
      - text
      - image
      contextWindow: 1048576
      maxTokens: 65536
      thinking:
        mode: anthropic-adaptive
        efforts:
        - low
        - medium
        - high
        - xhigh
        - max
        defaultLevel: max
        requiresEffort: true
  mafia:
    baseUrl: https://api.appintheloop.com/v1
    api: anthropic-messages
    auth: apiKey
    # 不写真实 key。值先走 omp 的 resolveConfigValue()：
    #   1. `!cmd` 前缀 -> 跑 shell 命令取 stdout
    #   2. 整串是合法环境变量名（$envExact）-> 读该环境变量
    #   3. 都不是 -> 当字面量用
    # MAFIA_API_KEY 在 ~/.common_shell_setup_local.sh（不入库）里 export。
    apiKey: MAFIA_API_KEY
    # 该网关 /v1/models 不返回 token_limits（只有 id/owned_by/supported_endpoint_types），
    # 发现值一律落到插件兜底 200000/64000；1M 取自内置目录 anthropic 同名模型。
    models:
    - id: claude-fable-5-1
      name: claude-fable-5-1
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5
      name: claude-opus-5-5
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: MiniMax-M3.1-Flash
      name: MiniMax-M3.1-Flash
      reasoning: true
      contextWindow: 1000000
      headers:
        X-Sub-Module: claude-code-internal
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
  # kafara（ai.kafara.men）：/v1/models 只回 id/object/created/owned_by，不声明 token_limits，
  # 发现值一律落到插件兜底 200000/64000。窗口照 mafia 块同款模型补成 1M（内置目录 anthropic
  # 的 claude-opus-5-5 / claude-fable-5-1）；kafara 侧 id 是 devin/ 前缀或 -high 后缀，按原样写。
  # 不需要 mafia 的 X-Sub-Module 头：默认编码系统提示 + 无头直连实测 200（stopReason=stop）。
  kafara:
    baseUrl: https://ai.kafara.men/v1
    api: anthropic-messages
    auth: apiKey
    apiKey: KAFARA_API_KEY
    models:
    - id: devin/claude-opus-5-5
      name: devin/claude-opus-5-5
      reasoning: true
      contextWindow: 1000000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: claude-opus-5-5-high
      name: claude-opus-5-5-high
      reasoning: true
      contextWindow: 1000000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
    - id: devin/claude-fable-5-1
      name: devin/claude-fable-5-1
      reasoning: true
      contextWindow: 1000000
      thinking:
        mode: anthropic-adaptive
        efforts: ["low","medium","high","xhigh","max"]
  # 火山引擎方舟 Coding Plan（Pro 订阅）。本机只用 Kimi-K3.1-Pro，所以这里写成
  # 静态 provider（不经 gateways-login.json 发现）：发现结果会把账号下 38 个模型
  # 全拉进来，deepseek/doubao/glm 就仍可被选中。apiKey 用 `!命令` 引用，理由同
  # gateways-login.json：xmatrix daemon 拉起的 omp 没有 VE_CODE_API_KEY。
  volcengine:
    baseUrl: https://ark.cn-beijing.volces.com/api/coding/v1
    api: anthropic-messages
    auth: apiKey
    apiKey: "!grep -m1 '^export VE_CODE_API_KEY=' $HOME/.common_shell_setup_local.sh | cut -d= -f2- | tr -d '\"'"
    models:
    - id: kimi-k3.1-pro
      name: kimi-k3.1-pro
      reasoning: true
      input: [text, image]
      contextWindow: 1048576
      maxTokens: 131072

setupVersion: 2
startup:
  quiet: true
enabledModels:
  - mafia/claude-opus-5-5
  - devin/claude-opus-5-5
  - devin/claude-opus-5-5-fast
  - mafia/claude-fable-5-1
  - devin/claude-fable-5-1
  - devin/gpt-6-1-sol
  - devin/gpt-6-astra
  - deepseek/deepseek-v4-pro
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-flash
  - deepseek/deepseek-v4-flash-vision-exp
  - zai/glm-5.3-flash
  - mafia/MiniMax-M3.1-Flash
  - minimax-test/*
  - devin/*
  - mafia/*
  - kafara/*
  - volcengine/kimi-k3.1-pro
modelRoles:
  default: minimax-test/MiniMax-M78:auto
  tiny: mafia/claude-opus-5-5:medium
  smol: minimax-test/MiniMax-M3.1-Flash:auto
  slow: kafara/gpt-6-sol:max
  vision: mafia/claude-opus-5-5:max
  mafia-opus: mafia/claude-opus-5-5:auto
  devin-opus: devin/claude-opus-5-5:auto
  devin-opus-fast: devin/claude-opus-5-5-fast:auto
  kafara-opus: kafara/devin/claude-opus-5-5:auto
  kafara-opus-fast: kafara/devin/claude-opus-5-5-fast:auto
  mafia-fable: mafia/claude-fable-5-1:auto
  devin-fable: devin/claude-fable-5-1:auto
  devin-sol: devin/gpt-6-1-sol:auto
  devin-astra: devin/gpt-6-astra:auto
  deepseek-pro: deepseek/deepseek-v4-pro:auto
  deepseek-vflash: deepseek/deepseek-v4-flash:auto
  deepseek-flash: deepseek/deepseek-flash:auto
  mafia-minimax: mafia/MiniMax-M3.1-Flash:auto
  minimax-pro: minimax-test/MiniMax-M78:auto
  zai-flash: zai/glm-5.3-flash:max
  task: minimax-test/MiniMax-M78:auto
  advisor: mafia/claude-opus-5-5:high
cycleOrder:
  - mafia-opus
  - devin-opus
  - devin-opus-fast
  - mafia-fable
  - devin-fable
  - devin-sol
  - devin-astra
  - deepseek-pro
  - deepseek-flash
retry:
  fallbackChains:
    # 默认模型降级只走同为 1M 窗口的模型：中途切到 200K 窗口（mafia/kafara 兜底值）
    # 会把已经很长的一轮撑爆，所以这里不接 mafia 那条链。
    minimax-test/MiniMax-M78:
      - minimax-test/MiniMax-M3.1-Flash
      - minimax-test/MiniMax-M3
      - deepseek/deepseek-flash
    mafia/claude-opus-5-5:
      - devin/claude-opus-5-5
      - kafara/devin/claude-opus-5-5
      - kafara/claude-opus-5-5-high
    mafia/gpt-6-astra:
      - devin/gpt-6-astra
      - kafara/devin/gpt-6-astra
      - kafara/gpt-6-astra
    mafia/*:
      - devin/claude-opus-5-5
      - kafara/devin/claude-opus-5-5
    default:
      - deepseek/deepseek-flash
task:
  agentModelOverrides:
    reviewer: devin/gpt-6-1-sol:auto
defaultThinkingLevel: auto
compaction:
  methodOrder:
    - shake
    - handoff
    - remote
    - snapcompact
    - soft
  # 1M 窗口（minimax-test/*、deepseek-flash）的压缩口径。
  # thresholdPercent 85：触发线 = 窗口 × 85%（1M → 891,289 token）。
  # 不写这一项时 omp 用「窗口 − 15% 预留」，两者在 1M 上只差 1 token；
  # 写死百分比是为了让口径与窗口解耦，换模型时触发线按比例走而不是靠预留反推。
  thresholdPercent: 85
  # 压缩后保留多少原文。omp 按窗口自动夹紧：保留上限 = 恢复带（阈值 × 0.8）
  # 减预留，1M 窗口 → 692,551，200K 窗口 → 115,520。
  # 所以这个值只对 1M 窗口生效，小窗口模型夹紧后与原值一致，行为不变。
  keepRecentTokens: 400000
  # 预留 = 触发线以下留给一次回复的余量；小窗口模型仍走 15% 比例预留。
  reserveTokens: 20480
  handoffSaveToDisk: true
dev:
  autoqaConsent: denied
display:
  showTokenUsage: true
  showTurnTime: true
  hideToolActivity: true
hideThinkingBlock: false
symbolPreset: nerd
statusLine:
  preset: custom
  rightSegments:
    - context_pct
    - session_name
    - session
    - subagents
    - usage
    - cache_hit
    - cost
  compactThinkingLevel: false
  transparent: false
  showHookStatus: true
composer:
  tokenRate: true
colorBlindMode: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
contextPromotion:
  enabled: true

setupVersion: 2
enabledModels:
  - mafia/claude-opus-5-5
  - devin/*
  - mafia/claude-fable-5-1
  - deepseek/deepseek-v4-pro
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-flash
  - deepseek/deepseek-v4-flash-vision-exp
  - mafia/MiniMax-M3.1-Flash-Preview
modelRoles:
  default: deepseek/deepseek-flash:auto
  tiny: mafia/claude-opus-5-5:medium
  smol: mafia/claude-opus-5-5:max
  slow: mafia/claude-fable-5-1:max
  vision: mafia/claude-opus-5-5:max
  mafia-opus: mafia/claude-opus-5-5:auto
  devin-opus: devin/claude-opus-5-5:auto
  devin-opus-fast: devin/claude-opus-5-5-fast:auto
  mafia-fable: mafia/claude-fable-5-1:auto
  devin-fable: devin/claude-fable-5-1:auto
  deepseek-pro: deepseek/deepseek-v4-pro:auto
  deepseek-vflash: deepseek/deepseek-v4-flash:auto
  deepseek-flash: deepseek/deepseek-flash:auto
  mafia-minimax: mafia/MiniMax-M3.1-Flash-Preview:auto
cycleOrder:
  - mafia-opus
  - devin-opus
  - devin-opus-fast
  - mafia-fable
  - devin-fable
  - deepseek-pro
  - deepseek-flash
retry:
  fallbackChains:
    mafia/*:
      - devin/*
    devin/*:
      - mafia/*
defaultThinkingLevel: auto
compaction:
  methodOrder:
    - shake
    - handoff
    - remote
    - snapcompact
    - soft
  keepRecentTokens: 150000
  reserveTokens: 20480
  handoffSaveToDisk: true
dev:
  autoqaConsent: denied
display:
  showTokenUsage: true
  showTurnTime: true
  hideToolActivity: true
hideThinkingBlock: true
symbolPreset: nerd
statusLine:
  preset: custom
  rightSegments:
    - context_pct
    - session_name
    - session
    - subagents
    - usage
    - cache_hit
    - cost
  compactThinkingLevel: false
  transparent: false
composer:
  tokenRate: true
colorBlindMode: false
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
contextPromotion:
  enabled: true
setupVersion: 2
enabledModels:
  - mafia/claude-opus-5-5
  - devin/claude-opus-5-5
  - devin/claude-opus-5-5-fast
  - mafia/claude-fable-5-1
  - devin/claude-fable-5-1
  - deepseek/deepseek-v4-pro
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-flash
  - deepseek/deepseek-v4-flash-vision-exp
modelRoles:
  default: deepseek/deepseek-flash
  tiny: mafia/claude-opus-5-5:medium
  smol: mafia/claude-opus-5-5:max
  slow: mafia/claude-fable-5-1:max
  vision: mafia/claude-opus-5-5:max
  mafia-opus: mafia/claude-opus-5-5:max
  devin-opus: devin/claude-opus-5-5:max
  devin-opus-fast: devin/claude-opus-5-5-fast:max
  mafia-fable: mafia/claude-fable-5-1:max
  devin-fable: devin/claude-fable-5-1:max
  deepseek-pro: deepseek/deepseek-v4-pro:max
  deepseek-vflash: deepseek/deepseek-v4-flash:max
  deepseek-flash: deepseek/deepseek-flash:max
cycleOrder:
  - mafia-opus
  - devin-opus
  - devin-opus-fast
  - mafia-fable
  - devin-fable
  - deepseek-pro
  - deepseek-flash
retry:
  fallbackChains:
    mafia/*:
      - devin/*
    devin/*:
      - mafia/*
defaultThinkingLevel: max
compaction:
  methodOrder:
    - shake
    - handoff
    - remote
    - snapcompact
    - soft
  keepRecentTokens: 150000
  reserveTokens: 20480
  handoffSaveToDisk: true
dev:
  autoqaConsent: denied
display:
  showTokenUsage: true
  showTurnTime: true
  hideToolActivity: true
hideThinkingBlock: true
symbolPreset: nerd
statusLine:
  preset: custom
  rightSegments:
    - context_pct
    - session_name
    - subagents
    - usage
    - cache_hit
    - cost
  compactThinkingLevel: false
composer:
  tokenRate: true
colorBlindMode: false
memory:
  backend: local
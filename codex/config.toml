# OpenAI Codex shared configuration.
# Modern codex CLI reads ~/.codex/config.toml (config.json / settings.json are deprecated).

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

# Match the local Codex workflow: run without interactive approval prompts or
# filesystem sandboxing, and opt into the faster service tier.
approval_policy = "never"
sandbox_mode = "danger-full-access"
service_tier = "fast"

model_provider = "openai_http"

[model_providers.openai_http]
name = "OpenAI HTTP only"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false
base_url = "https://chatgpt.com/backend-api/codex"

# Responses-compatible providers used by native Codex subagent roles.
# Credentials remain in environment variables and are never stored here.
[model_providers.dspix]
name = "DeepSeek Responses"
base_url = "https://api.deepseek.com"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"

[model_providers.glmpix]
name = "ZAI Responses"
base_url = "https://open.bigmodel.cn/api/v1"
env_key = "ZAI_API_KEY"
wire_api = "responses"

# Native Codex team. Keep delegation flat so workers cannot recursively fan
# out another generation of up to 50 agents.
[agents]
enabled = true
max_concurrent_threads_per_session = 50
max_depth = 1

[agents.dspix]
description = "Low-cost worker for simple, mechanical, independent toil."
config_file = "../dotfiles/codex/agents/dspix.toml"

[agents.glmpix]
description = "Stronger worker for tasks needing non-trivial reasoning, diagnosis, or review."
config_file = "../dotfiles/codex/agents/glmpix.toml"

[features]
js_repl = false
# Disable the built-in Apps/Sites MCP server (codex_apps). It tries to reach
# OpenAI's App Garden backend at startup, adding ~5s+ latency. Turn back on by
# setting `apps = true` if you use Codex's website deployment (Sites) feature.
apps = false
memories = true
chronicle = true
hooks = true
prevent_idle_sleep = true

# Cross-provider workers cannot decrypt ChatGPT's encrypted collaboration
# arguments. Keep this opt-in scoped to this native DeepSeek/Ark team setup.
# [features.multi_agent_v2]
# encrypted_messages = false

# Keep startup fast: cap how long codex waits for MCP servers before giving up
# (the previous value of 120s could block startup for up to 2 minutes).
[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 10

[shell_environment_policy]
inherit = "core"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true
followUpQueueMode = "queue"
selected-avatar-id = "hoots"
keepRemoteControlAwakeWhilePluggedIn = true

[projects."/Users/magic/dotfiles"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "context-used", "weekly-limit", "thread-id", "current-dir"]
status_line_use_colors = true
theme = "coldark-dark"

[tui.model_availability_nux]
"gpt-5.6-sol" = 3

[hooks.state]

[hooks.state."/Users/magic/.codex/hooks.json:stop:0:0"]
trusted_hash = "sha256:e8dd3827a3cec0a1a3ac965d2b5c330121e396370e63f309cb6646d33e405c03"

# OpenAI Codex shared configuration — the only git-tracked Codex config.
#
# This file is NOT the live config and is NOT symlinked anywhere. Codex has no
# include/extends mechanism, so scripts/codex-config-sync.py merges it into
# ~/.codex/config.toml on every install and every 15-minute sync:
#
#   ~/.codex/config_local.toml   untracked per-machine overrides   (wins)
#   codex/config.toml            this file, shared defaults        (middle)
#   ~/.codex/config.toml         live file, machine state          (base)
#
# Keep out of this file anything Codex writes at runtime, because that would
# push machine state into git — that is why [projects.*] trust levels,
# [hooks.state], [marketplaces.*], [plugins.*], [notice.*], [desktop] and
# [tui] nux/screen-reader state live only in the live file. Per-machine values
# for a key defined here go in ~/.codex/config_local.toml, e.g. Linux hosts
# disable the macOS-only [mcp_servers.node_repl] entry there with
# `enabled = false`.
#
# [[skills.config]] toggles are user-authored per-machine policy: they live in
# config_local.toml, not here. A list replaces the lower layer wholesale, so a
# machine that defines [[skills.config]] fully owns its own toggle list.
#
# Modern codex CLI reads ~/.codex/config.toml (config.json / settings.json are deprecated).

model = "gpt-5.5"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"

# Match the local Codex workflow: run without interactive approval prompts or
# filesystem sandboxing, and opt into the faster service tier.
approval_policy = "never"
sandbox_mode = "danger-full-access"
service_tier = "fast"

model_provider = "openai_http"

[model_providers.openai_http]
name = "OpenAI HTTP only"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false
base_url = "https://chatgpt.com/backend-api/codex"

[model_providers.mafia]
name = "Mafia"
base_url = "https://api.appintheloop.com/v1"
env_key = "MAFIA_API_KEY"
wire_api = "responses"

# Responses-compatible providers used by native Codex subagent roles.
# Credentials remain in environment variables and are never stored here.
[model_providers.dspix]
name = "DeepSeek Responses"
base_url = "https://api.deepseek.com"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"

[model_providers.glmpix]
name = "ZAI Responses"
base_url = "https://open.bigmodel.cn/api/v1"
env_key = "ZAI_API_KEY"
wire_api = "responses"

# Native Codex team. Keep delegation flat so workers cannot recursively fan
# out another generation of up to 50 agents.
[agents]
enabled = true
max_concurrent_threads_per_session = 50
max_depth = 1

[agents.dspix]
description = "Low-cost worker for simple, mechanical, independent toil."
config_file = "../dotfiles/codex/agents/dspix.toml"

[agents.glmpix]
description = "Stronger worker for tasks needing non-trivial reasoning, diagnosis, or review."
config_file = "../dotfiles/codex/agents/glmpix.toml"

[features]
js_repl = false
# Disable the built-in Apps/Sites MCP server (codex_apps). It tries to reach
# OpenAI's App Garden backend at startup, adding ~5s+ latency. Turn back on by
# setting `apps = true` if you use Codex's website deployment (Sites) feature.
apps = false
memories = true
chronicle = true
hooks = true
prevent_idle_sleep = true

# Cross-provider workers cannot decrypt ChatGPT's encrypted collaboration
# arguments. Keep this opt-in scoped to this native DeepSeek/Ark team setup.
# [features.multi_agent_v2]
# encrypted_messages = false

# ChatGPT desktop app MCP server (macOS path). Linux hosts keep the entry but
# disable it in ~/.codex/config_local.toml, so the shared file stays the single
# source of truth. Keep startup_timeout_sec small: the previous 120s value could
# block startup for up to two minutes.
[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 10

[shell_environment_policy]
inherit = "core"

[tui]
status_line = ["model-with-reasoning", "context-used", "weekly-limit", "thread-id", "current-dir"]
status_line_use_colors = true
theme = "coldark-dark"

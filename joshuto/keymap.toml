# =============================================================================
# Joshuto Keymap Configuration
# =============================================================================
# Aligned with Yazi v26.1.22 and local yazi/keymap.toml.
# Joshuto-only extensions and differences are noted below.
# Quit integration:
#   q  = quit and cd to browsed directory (exit code 101)
#   Q  = quit without cd (exit code 0)

# Differences: Tab cycles tabs (no Yazi spot view); l/Right/Enter also open files.
# H goes to the last directory; L/M retain Joshuto page positioning (no forward history).
# V remains Joshuto's visual toggle; there is no Yazi visual-unset equivalent.
# a/Ctrl-n use a terminal prompt; append / to create a directory. T opens $SHELL.
# : is the Joshuto command prompt; ; opens its external-command prompt.
# s* sorts and S uses fzf; recursive fd/rg search remains a Yazi-only feature.
# ? remains help (no reverse-search prompt); ~ and F1 also show help.
# d uses the configured trash; D permanently deletes. Both retain confirmation.
# -/_ use Joshuto's selected/current files, rather than Yazi's yank buffer.

[default_view]
keymap = [
	{ keys = ["escape"], commands = ["escape"] },
	{ keys = ["ctrl+t"], commands = ["new_tab"] },
	{ keys = ["alt+t"], commands = ["new_tab --cursor"] },
	{ keys = ["T"], commands = ["shell sh -c 'exec \"${SHELL:-/bin/sh}\"'"] },
	{ keys = ["W"], commands = ["close_tab"] },
	{ keys = ["ctrl+w"], commands = ["close_tab"] },
	{ keys = ["q"], commands = ["quit --output-current-directory"] },
	{ keys = ["ctrl+c"], commands = ["close_tab"] },
	{ keys = ["ctrl+z"], commands = ["suspend"] },
	{ keys = ["Q"], commands = ["quit"] },
	{ keys = ["R"], commands = ["reload_dirlist"] },
	{ keys = ["ctrl+h"], commands = ["toggle_hidden"] },
	{ keys = ["\t"], commands = ["tab_switch 1"] },
	{ keys = ["backtab"], commands = ["tab_switch -1"] },

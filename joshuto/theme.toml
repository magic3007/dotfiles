tar.fg = "red"
tgz.fg = "red"
txz.fg = "red"
xz.fg = "red"
zip.fg = "red"
zst.fg = "red"
zstd.fg = "red"

# Documents
pdf.fg = "cyan"
doc.fg = "cyan"
rtf.fg = "cyan"

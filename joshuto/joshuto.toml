# =============================================================================
# Joshuto Configuration
# =============================================================================
# Docs: https://github.com/kamiyaa/joshuto/tree/v0.9.9/docs/configuration

# Prefer mimetype.toml ($EDITOR for text); fall back to the system opener.
xdg_open = true
use_trash = true
watch_files = true
mouse_support = true
focus_on_create = true
case_insensitive_ext = true

# Launch the external opener without blocking Joshuto
xdg_open_fork = true

[display]
mode = "default"
show_borders = true
show_hidden = false

# Match Yazi's file icons (Nerd Font glyphs / terminal font fallback).
show_icons = true

# Keep Yazi's stable three-column layout, including unsupported previews.
collapse_preview = false

# Match yazi/yazi.toml: parent, current directory, preview.
column_ratio = [1, 4, 3]
scroll_offset = 5
line_number_style = "none"
linemode = "size"

[display.sort]
sort_method = "natural"
case_sensitive = false
directories_first = true
reverse = false

[preview]
# Allow images/PDFs/archives; the script separately bounds text and tool output.
max_preview_size = "100MB"
preview_script = "~/.config/joshuto/preview_file.sh"
# cmux/Ghostty: avoid 0.9.9 auto-probe replies leaking into keyboard input.
# On terminals without Kitty graphics, use "halfblocks" instead.
preview_protocol = "kitty"
# Decode images directly; macOS does not provide Linux XDG thumbnailers.
use_xdg_thumbs = false

[search]
# Case-insensitive string matching
string_case_sensitivity = "insensitive"

# Match local Yazi opener order: EDITOR (default vim), system open, reveal.
# Joshuto 0.9.9 MIME tables use type/subtype, not wildcard MIME strings.
# Subtype inheritance is not resolved by 0.9.9: explicit app_list is intentional.
# Linux reveal opens the containing directory; macOS selects files in Finder.
[class]
text_default = [
  { command = "sh", args = ["-c", "operation=edit; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-edit"] },
  { command = "sh", args = ["-c", "operation=reveal; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-reveal"], fork = true, silent = true },
  { command = "sh", args = ["-c", "operation=exif; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-exif"] }
]

media_default = [
  { command = "sh", args = ["-c", "operation=open; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-open"], fork = true, silent = true },
  { command = "sh", args = ["-c", "operation=reveal; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-reveal"], fork = true, silent = true },
  { command = "sh", args = ["-c", "operation=exif; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-exif"] }
]

archive_default = [
  { command = "sh", args = ["-c", "operation=reveal; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-reveal"], fork = true, silent = true },
  { command = "sh", args = ["-c", "operation=exif; exec sh \"${XDG_CONFIG_HOME:-$HOME/.config}/joshuto/open_file.sh\" \"$operation\" \"$@\"", "joshuto-exif"] }
]

